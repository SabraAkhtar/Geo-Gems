<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="geo-gems-logo">
  <!-- Geometric Faceted Gemstone 'G' Icon -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="goldGradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C86A" />
        <stop offset="45%" stop-color="#C49A3A" />
        <stop offset="100%" stop-color="#8F681C" />
      </linearGradient>
      <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FDF3CE" />
        <stop offset="100%" stop-color="#D4AA44" />
      </linearGradient>
      <linearGradient id="goldGradientDark" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#A77B24" />
        <stop offset="100%" stop-color="#6B4B0E" />
      </linearGradient>
    </defs>

    <!-- Outer Faceted Hexagonal Gem Outline for G -->
    <!-- Top-left facet -->
    <polygon points="18,4 36,4 28,14 14,14" fill="url(#goldGradientLight)" opacity="0.95" />
    <polygon points="36,4 44,14 36,22 28,14" fill="url(#goldGradientPrimary)" />
    <!-- Top edge -->
    <polygon points="18,4 8,16 14,20 18,14" fill="url(#goldGradientDark)" />
    <!-- Left outer facets -->
    <polygon points="8,16 4,28 14,30 14,20" fill="url(#goldGradientPrimary)" />
    <polygon points="4,28 8,40 14,38 14,30" fill="url(#goldGradientDark)" />
    <polygon points="8,40 18,52 24,42 14,38" fill="url(#goldGradientPrimary)" />
    <!-- Bottom facet -->
    <polygon points="18,52 36,52 38,42 24,42" fill="url(#goldGradientDark)" />
    <polygon points="36,52 46,40 38,36 38,42" fill="url(#goldGradientPrimary)" />
    <!-- Right side opening forming the 'G' -->
    <polygon points="46,40 46,26 36,26 38,36" fill="url(#goldGradientLight)" />
    <!-- Inward bar of the G -->
    <polygon points="46,26 26,26 28,34 38,34" fill="url(#goldGradientPrimary)" />
    <!-- Brilliant Center Facet Shimmer -->
    <polygon points="28,20 36,22 28,26" fill="#FFF2BF" opacity="0.8" />
    <!-- Diamond point accent -->
    <polygon points="28,14 36,22 28,34 20,24" fill="url(#goldGradientPrimary)" opacity="0.9" />
  </g>

  <!-- Typography: GEO GEMS CRYSTALS -->
  <text x="68" y="27" font-family="'Cormorant Garamond', 'Cinzel', 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="currentColor">
    GEO GEMS
  </text>
  <text x="68" y="44" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="#C49A3A">
    CRYSTALS
  </text>
  <text x="68" y="55" font-family="'Montserrat', sans-serif" font-size="7" font-weight="500" letter-spacing="3" fill="#888888" opacity="0.85">
    NATURAL STONES
  </text>
</svg>
